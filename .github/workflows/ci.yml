name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Validate Supabase migration on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -f supabase/tests/prelude.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f supabase/tests/schema_test.sql
